<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Quiz-Baukasten – Nahost-Ausstellung</title>
<link rel="stylesheet" href="../assets/pinnwand.css">
<link rel="stylesheet" href="baukasten.css">
</head>
<body class="packpapier">
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
<symbol id="i-kreis" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/></symbol>
<symbol id="i-dreieck" viewBox="0 0 24 24"><path d="M12 3.5 21 19.5H3Z"/></symbol>
<symbol id="i-quadrat" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/></symbol>
<symbol id="i-raute" viewBox="0 0 24 24"><path d="M12 2.5 21.5 12 12 21.5 2.5 12Z"/></symbol>
<symbol id="i-sechseck" viewBox="0 0 24 24"><path d="M7.5 3.5h9L21 12l-4.5 8.5h-9L3 12Z"/></symbol>
<symbol id="i-haken" viewBox="0 0 24 24"><path d="m4.5 12.5 5 5 10-11"/></symbol>
<symbol id="i-kreuz" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
<symbol id="i-pfeil-hoch" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
<symbol id="i-pfeil-runter" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
<symbol id="i-neu" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></symbol>
<symbol id="i-extern" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
<symbol id="i-stift" viewBox="0 0 24 24"><path d="m4 20 4-1 11-11-3-3L5 16Z M14 7l3 3"/></symbol>
<symbol id="i-lupe" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20 20"/></symbol>
<symbol id="i-zurueck" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
<symbol id="i-weiter" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
<symbol id="i-hinweis" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></symbol>
<symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
<symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 20V9M7 14l5-5 5 5M5 4h14"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-muell" viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></symbol>
<symbol id="i-brille" viewBox="0 0 24 24"><circle cx="6.5" cy="14" r="3.5"/><circle cx="17.5" cy="14" r="3.5"/><path d="M10 14h4M3 14l1.6-7M21 14l-1.6-7"/></symbol>
<symbol id="i-auge" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-haus" viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5M6 9.5V20h12V9.5"/></symbol>
<symbol id="i-nadel" viewBox="0 0 24 24"><path d="M9 3h6l-1 6 3 3H7l3-3ZM12 12v9"/></symbol>
</svg>

<div class="bk-wand">
  <header class="bk-kopf">
    <div class="karte bk-titel"><h1 id="editor-titel">Quiz-Baukasten</h1><p>Fragen für die Quiz-Arena eingeben, prüfen und als <b>fragen.json</b> speichern.</p></div>
    <p class="karte gelb notiz nadel-blau">Jede Gruppe exportiert ihre Fragen. Herr Kopplin führt danach alle Dateien hier zusammen.</p>
    <a class="zurueck" href="./"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-zurueck"></use></svg>Baukasten-Übersicht</a>
  </header>
  <div class="karte werkzeug ohne-nadel">
    <button type="button" class="knopf haupt" id="neu"><svg class="ic" aria-hidden="true"><use href="#i-plus"></use></svg>Neue Frage</button>
    <button type="button" class="knopf haupt" id="export"><svg class="ic" aria-hidden="true"><use href="#i-download"></use></svg>fragen.json exportieren</button>
    <label class="knopf datei-knopf"><svg class="ic" aria-hidden="true"><use href="#i-upload"></use></svg>fragen.json importieren (mehrere möglich)<input type="file" id="datei" accept=".json,application/json" multiple></label>
    <button type="button" class="knopf" id="arena-laden"><svg class="ic" aria-hidden="true"><use href="#i-neu"></use></svg>Aktuelle Arena-Fragen holen</button>
    <button type="button" class="knopf leise warnung" id="leeren"><svg class="ic" aria-hidden="true"><use href="#i-muell"></use></svg>Entwurf leeren</button>
    <p class="status" id="speicherstatus" aria-live="polite"></p>
  </div>
  <div class="aktion-meldung" id="aktion-meldung" role="status"></div>
  <div class="feld karte ohne-nadel" style="padding:16px 18px;margin-bottom:28px;max-width:44rem">
    <label for="titel-feld">Titel des Fragen-Sets</label>
    <input type="text" id="titel-feld" placeholder="z. B. Quiz Konfliktanalyse Nahost – LK Q2">
  </div>
  <div class="quiz-raster">
    <nav class="karte fragenliste ohne-nadel" aria-labelledby="h-liste">
      <h2 id="h-liste">Fragen</h2>
      <div class="filter" id="filter" role="group" aria-label="Nach Station filtern"></div>
      <ol class="fl" id="fl"></ol>
    </nav>
    <div id="frage-form" class="formular"></div>
    <aside class="seitenleiste" aria-label="Prüfung und Vorschau">
      <section class="karte pruef nadel-blau" aria-labelledby="h-pruef"><h2 id="h-pruef">Prüfliste</h2><div id="pruefliste"></div></section>
      <section class="karte vorschau-karte" id="vorschau-box" aria-live="polite"></section>
      <section class="karte statistik nadel-blau" id="statistik"></section>
    </aside>
  </div>

</div>
<script src="../arena/fragen-eingebettet.js"></script>
<script src="quiz.js"></script>
</body>
</html>
