<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feedback – Ausstellung Konfliktanalyse Nahost</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#c4a173">
<link rel="stylesheet" href="../assets/pinnwand.css">
<link rel="stylesheet" href="../arena/arena.css">
<link rel="stylesheet" href="feedback.css">
</head>
<body class="spieler packpapier">
<main class="sp-wrap exit">
  <header class="karte sp-kopf exit-kopf" id="exit-kopf">
    <h1 class="sp-name">Wie fandest du die Ausstellung?</h1>
    <p class="hand">Drei kurze Fragen – anonym, ohne Namen.</p>
  </header>
  <form id="exit-form" class="exit-form" novalidate>
    <div class="sp-fb" id="exit-fragen"></div>
    <div class="sp-aktionen">
      <button type="submit" class="knopf haupt" id="exit-senden">Absenden</button>
    </div>
    <p class="exit-meldung hand" id="exit-meldung" role="status"></p>
  </form>
  <section class="karte sp-info exit-danke" id="exit-danke" hidden>
    <p class="gross">Danke!</p>
    <p>Deine Rückmeldung hilft dem Sowi-Kurs.</p>
    <p class="hand">Die Seite ist gleich wieder bereit für die Nächsten.</p>
  </section>
  <p class="exit-fuss"><a href="../">Zur Startseite der Ausstellung</a></p>
</main>
<script src="../arena/common.js"></script>
<script src="feedback.js"></script>
</body>
</html>
